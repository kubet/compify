name: Package release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Public package to validate or publish
        required: true
        type: choice
        options:
          - cli
          - storybook
      publish:
        description: Publish through npm trusted publishing (false is dry-run only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Require the immutable package tag
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          version=$(bun -e "console.log(require('./packages/$PACKAGE/package.json').version)")
          test "$GITHUB_REF" = "refs/tags/$PACKAGE-v$version" || {
            echo "Run this workflow from $PACKAGE-v$version, not $GITHUB_REF" >&2
            exit 1
          }
      - name: Test the exact packed package
        working-directory: packages/${{ inputs.package }}
        run: |
          bun install --frozen-lockfile
          bun run test:package
          bun pm pack --dry-run
      - name: npm publication dry run
        working-directory: packages/${{ inputs.package }}
        run: npm publish --dry-run --access public

  publish:
    if: inputs.publish == true
    needs: validate
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Pin an npm CLI with trusted-publishing support
        run: npm install --global npm@11.6.2
      - name: Rebuild and publish with provenance
        working-directory: packages/${{ inputs.package }}
        run: |
          bun install --frozen-lockfile
          bun run test:package
          npm publish --access public --provenance
