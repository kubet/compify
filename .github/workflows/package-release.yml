name: Package release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Public package to validate or publish
        required: true
        type: choice
        options:
          - cli
          - storybook
      publish:
        description: Publish through npm trusted publishing (false is dry-run only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  checks: read

# A registry version is immutable; serialize retries for the same package tag.
concurrency:
  group: package-release-${{ github.ref }}-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      package-sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Bind both jobs to the dispatch commit even if a tag is moved later.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Require the immutable package tag
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          version=$(bun -e "console.log(require('./packages/$PACKAGE/package.json').version)")
          test "$GITHUB_REF" = "refs/tags/$PACKAGE-v$version" || {
            echo "Run this workflow from $PACKAGE-v$version, not $GITHUB_REF" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo "Checkout is not the workflow dispatch commit" >&2
            exit 1
          }
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "The package tag must identify a commit already contained in origin/main" >&2
            exit 1
          }
      - name: Require release gates on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" > /tmp/check-runs.json
          for check in changes required "JavaScript and TypeScript"; do
            conclusion=$(jq -r --arg check "$check" '
              [.check_runs[]
                | select(.name == $check and .app.slug == "github-actions")]
              | sort_by(.started_at // .completed_at)
              | last
              | .conclusion // "missing"
            ' /tmp/check-runs.json)
            test "$conclusion" = success || {
              echo "Required check '$check' is $conclusion on $GITHUB_SHA" >&2
              exit 1
            }
          done
      - name: Pin an npm CLI with trusted-publishing support
        run: npm install --global npm@11.6.2
      - name: Build, test, and hash the exact publication tarball
        id: pack
        working-directory: packages/${{ inputs.package }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run test:package
          npm pack --ignore-scripts --json > /tmp/npm-pack.json
          tarball=$(node -e "console.log(require('/tmp/npm-pack.json')[0].filename)")
          sha256=$(sha256sum "$tarball" | cut -d ' ' -f 1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          npm publish "$tarball" --dry-run --access public --ignore-scripts

  publish:
    if: inputs.publish == true
    needs: validate
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Pin an npm CLI with trusted-publishing support
        run: npm install --global npm@11.6.2
      - name: Reproduce and publish the validated tarball with provenance
        working-directory: packages/${{ inputs.package }}
        env:
          EXPECTED_SHA256: ${{ needs.validate.outputs.package-sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bun install --frozen-lockfile
          bun run test:package
          npm pack --ignore-scripts --json > /tmp/npm-pack.json
          tarball=$(node -e "console.log(require('/tmp/npm-pack.json')[0].filename)")
          actual_sha256=$(sha256sum "$tarball" | cut -d ' ' -f 1)
          test "$actual_sha256" = "$EXPECTED_SHA256" || {
            echo "Package was not reproducible: expected $EXPECTED_SHA256, got $actual_sha256" >&2
            exit 1
          }
          npm publish "$tarball" --access public --provenance --ignore-scripts
