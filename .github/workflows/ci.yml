name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      cli: ${{ steps.filter.outputs.cli }}
      pack: ${{ steps.filter.outputs.pack }}
      template: ${{ steps.filter.outputs.template }}
      selfhost: ${{ steps.filter.outputs.selfhost }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/compify-pack/**'
              - 'docs/**'
            api:
              - 'apps/api/**'
            cli:
              - 'packages/cli/**'
            pack:
              - 'packages/compify-pack/**'
            template:
              - 'packages/templates/dark-solar-saas/**'
            selfhost:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'packages/compify-pack/**'
              - 'docs/**'
              - 'docker-compose.yml'
              - 'deploy/self-host.env.example'
              - 'scripts/self-host-smoke.ts'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run lint
      - run: bun run build

  compify-pack:
    needs: changes
    if: needs.changes.outputs.pack == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/compify-pack
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: compify
          POSTGRES_PASSWORD: compify-test
          POSTGRES_DB: compify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compify -d compify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run lint
      - run: bun run build
      - run: bun run test --runInBand
      - name: Verify migrations up and down
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: compify
          DB_PASSWORD: compify-test
          DB_DATABASE: compify
        run: bun run migration:run && bun run migration:revert && bun run migration:revert && bun run migration:run

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run build
      - run: bun run test

  template:
    needs: changes
    if: needs.changes.outputs.template == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/templates/dark-solar-saas
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run lint
      - run: bun run build

  self-host-smoke:
    needs: changes
    if: needs.changes.outputs.selfhost == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: compify-ci-postgres-only
      MINIO_ROOT_PASSWORD: compify-ci-minio-root-only
      MINIO_APP_SECRET_KEY: compify-ci-minio-app-only
      JWT_SECRET: compify-ci-jwt-secret-never-use-in-production
      INTERNAL_API_TOKEN: compify-ci-internal-secret-never-use-in-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Build and start the self-host stack
        run: docker compose up --build -d --wait
      - name: Verify the running product
        run: bun scripts/self-host-smoke.ts
      - name: Install API test dependencies
        working-directory: apps/api
        run: bun install --frozen-lockfile
      - name: Run real-application API E2E tests
        working-directory: apps/api
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: compify
          DB_PASSWORD: compify-ci-postgres-only
          DB_DATABASE: compify
          MINIO_ENDPOINT: localhost
          MINIO_PORT: 9000
          MINIO_USE_SSL: "false"
          MINIO_ACCESS_KEY: compify
          MINIO_SECRET_KEY: compify-ci-minio-app-only
        run: bun run test:e2e -- --runInBand
      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down the self-host stack
        if: always()
        run: docker compose down -v --remove-orphans

  self-host-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Docker Compose configuration
        run: docker compose --env-file deploy/self-host.env.example config --quiet
