name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun scripts/release-check.ts
      - run: bun scripts/supply-chain-check.ts
      - run: bun scripts/verify-sandpack-provenance.ts
      - run: docker compose --env-file deploy/self-host.env.example config --quiet

  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      cli: ${{ steps.filter.outputs.cli }}
      pack: ${{ steps.filter.outputs.pack }}
      storybook: ${{ steps.filter.outputs.storybook }}
      template: ${{ steps.filter.outputs.template }}
      selfhost: ${{ steps.filter.outputs.selfhost }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            web:
              - '.github/workflows/ci.yml'
              - 'apps/web/**'
              - 'packages/compify-pack/**'
              - 'docs/**'
            api:
              - '.github/workflows/ci.yml'
              - 'apps/api/**'
            cli:
              - '.github/workflows/ci.yml'
              - 'packages/cli/**'
              - 'examples/storybook-button/**'
              - 'examples/consumer-next-ts/**'
              - 'scripts/shadcn-consumer-smoke.ts'
            pack:
              - '.github/workflows/ci.yml'
              - 'packages/compify-pack/**'
            storybook:
              - '.github/workflows/ci.yml'
              - 'packages/storybook/**'
            template:
              - '.github/workflows/ci.yml'
              - 'packages/templates/dark-solar-saas/**'
            selfhost:
              - '.github/workflows/ci.yml'
              - 'apps/api/**'
              - 'apps/web/**'
              - 'packages/compify-pack/**'
              - 'docs/**'
              - 'docker-compose.yml'
              - 'deploy/self-host.env.example'
              - 'scripts/self-host-smoke.ts'
              - 'scripts/distribution-smoke.ts'
              - 'packages/cli/**'
              - 'examples/storybook-button/**'
              - 'examples/consumer-next-ts/**'

  web:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run lint
      - run: bun run build

  compify-pack:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.pack == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/compify-pack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test

  storybook:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/storybook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test:package
      - run: bun pm pack --dry-run

  api:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: compify
          POSTGRES_PASSWORD: compify-test
          POSTGRES_DB: compify_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compify -d compify_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run lint
      - run: bun run build
      - name: Run unit and PostgreSQL 16 migration integration tests
        env:
          TEST_DATABASE_URL: postgres://compify:compify-test@127.0.0.1:5432/compify_migration_test
          THEME_CAS_TEST_DATABASE_URL: postgres://compify:compify-test@127.0.0.1:5432/compify_migration_test
        run: bun run test --runInBand
      - name: Verify migrations up and down
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: compify
          DB_PASSWORD: compify-test
          DB_DATABASE: compify_migration_test
        run: bun run migration:run && bun run migration:revert && bun run migration:revert && bun run migration:run

  cli:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run build
      - run: bun run test
      - run: bun run test:package
      - run: bun pm pack --dry-run
      - name: Verify export in a clean shadcn 4.16.2 consumer
        run: bun ../../scripts/shadcn-consumer-smoke.ts

  template:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.template == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/templates/dark-solar-saas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run lint
      - run: bun run build

  self-host-smoke:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.selfhost == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: compify-ci-postgres-only
      MINIO_ROOT_PASSWORD: compify-ci-minio-root-only
      MINIO_APP_SECRET_KEY: compify-ci-minio-app-only
      JWT_SECRET: compify-ci-jwt-secret-never-use-in-production
      INTERNAL_API_TOKEN: compify-ci-internal-secret-never-use-in-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - name: Build and start the self-host stack
        run: docker compose up --build -d --wait
      - name: Build CLI for distribution E2E
        working-directory: packages/cli
        run: bun install --frozen-lockfile && bun run build
      - name: Verify migration startup is idempotent
        run: |
          docker compose restart api
          docker compose up -d --wait api
      - name: Verify the running product and registry lifecycle
        run: bun scripts/self-host-smoke.ts
      - name: Install browser E2E dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile && bunx playwright install --with-deps chromium
      - name: Verify browser registration and login journeys
        working-directory: apps/web
        run: bun run test:e2e
      - name: Verify source distribution workflows
        run: bun scripts/distribution-smoke.ts
      - name: Install API test dependencies
        working-directory: apps/api
        run: bun install --frozen-lockfile
      - name: Run real-application API E2E tests
        working-directory: apps/api
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: compify
          DB_PASSWORD: compify-ci-postgres-only
          DB_DATABASE: compify
          MINIO_ENDPOINT: 127.0.0.1
          MINIO_PORT: 9000
          MINIO_USE_SSL: "false"
          MINIO_ACCESS_KEY: compify-app
          MINIO_SECRET_KEY: compify-ci-minio-app-only
        run: bun run test:e2e -- --runInBand
      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down the self-host stack
        if: always()
        run: docker compose down -v --remove-orphans

  self-host-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Docker Compose configuration
        run: docker compose --env-file deploy/self-host.env.example config --quiet

  required:
    if: always()
    needs:
      - secrets
      - release-integrity
      - web
      - compify-pack
      - storybook
      - api
      - cli
      - template
      - self-host-smoke
      - self-host-config
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed or cancelled CI jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = JSON.parse(process.env.RESULTS);
            const bad = Object.entries(jobs).filter(([, value]) => !["success", "skipped"].includes(value.result));
            if (bad.length) {
              console.error("Failed CI jobs:", bad.map(([name, value]) => `${name}=${value.result}`).join(", "));
              process.exit(1);
            }
          '
